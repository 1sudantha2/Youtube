name: Build YT-MEDIA APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug + release APK
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "::group::failure tail"
            tail -c 8000 /tmp/build.log
            echo "::endgroup::"
            grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|> " /tmp/build.log | tail -40 | while read -r l; do
              echo "::error::${l//$'\n'/ }"
            done
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-MEDIA-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-MEDIA-release
          path: app/build/outputs/apk/release/*.apk
